# Đánh giá thử việc 
Nhân viên: Lý Minh Nhật
---
## Tình hình chung
- Tổng danh mục khách hàng: 190
- Tổng dư nợ: 5 tỷ
- Tình trạng thị trường: Có 80 cây có địa chỉ rõ ràng
- Khó khăn: Chưa quen công việc, địa bàn, nhiều cây địa chỉ không rõ ràng hoặc không tìm thấy nhà, khách lẩn trốn
---
## Chỉ tiêu công việc
- Thu pre-COF và PDS: 45tr
- Thu COF: 12tr
- Top up mới: 1
---
## Tình trạng khách hàng tiềm năng (có PTP)

- Đang làm công nhân [Công ty TNHH Uchiyama Việt Nam](https://umc-uvi.com/vn/)
- Thu nhập: 7tr
- Hứa tháng sau đóng

### Hà Thị Thuỷ
- Ở trọ
- Hứa tháng sau đóng
----
### Võ Thị Tiến Nhanh
- Hàng xóm nhà đối diện không biết ai tên Nhanh. Nhưng có vẻ có chơi với một người hàng xóm khác và rủ nhau đi chung
- Trốn tránh
- Có gặp hàng xóm, gia đình
- Ảnh đại diện Zalo chụp chung với một người đàn ông. Có vẻ là vừa đi ăn ở một tiệc cưới. Ảnh bìa là một đứa con gái tầm 7 tuổi.
- Hứa tháng sau đóng
----
### Võ Văn Bưng
- Chân đi cà nhắc
- Lý do chậm thanh toán: bị tai nạn

## Kế hoạch tác động
Kế hoạch tác động lại sẽ được triển khai vào tháng tới, nhờ sự hỗ trợ của anh em như Tuấn và Lộc, hoặc nhờ anh em ở khu vực Dĩ An nếu khách hàng hứa thanh toán nhưng không thực hiện. Cố gắng đến ngày 13 để hoàn thành việc đi vòng cuốn chiếu hết các khách hàng, đồng thời kết hợp lên thêm bốn hồ sơ topup mới cho khu vực Thuận An.
